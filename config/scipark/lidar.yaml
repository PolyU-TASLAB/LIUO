lidar0:  # horizontal lidar
    topic: /velodyne_points
    is_livox: false
    Extrinsics:  # lidar1 to imu
        time_offset: 0.000
        Trans: [-0.050, 0.0, 0.055]
        Rot: [1, 0, 0,
              0, 1, 0,
              0, 0, 1]

num_lidars: 1
lidar_timestamp_end: false  # if the timestamp of a lidar scan is set at the end of the scan

### FeatureExtraction ###
VLP16:  # in fact, it is Ouster in viral (VLP16 just denotes rotating lidar)
    N_SCAN: 32
    Horizon_SCAN: 1024
    edge_threshold: 1.0
    surf_threshold: 0.1
    odometry_surface_leaf_size: 0.4
    min_distance: 0.5
    max_distance: 200.0

### Odometry ###
use_corner_feature: true
current_scan_param:
    corner_leaf_size: 0.2
    surface_leaf_size: 0.5
    edge_min_valid_num: 10
    surf_min_valid_num: 100
    correspondence_downsample: 1
keyframe_strategy:
    angle_degree: 10
    dist_meter: 1.0
    time_second: 10
map_param:    
    keyframe_search_radius: 50.0
    keyframe_search_time: 10.0
    keyframe_density: 2
    cloud_reserved_time: -1  # [s]